name: Release

on:
  push:
    tags:
      - 'v*'
  # Re-run for an existing tag (e.g. to attach new platform builds).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v0.6.0'
        required: true

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid tag: $TAG"; exit 1; }

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Release $TAG" --generate-notes

  build-release:
    name: Build Release
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: sz_rabbit_publisher-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: sz_rabbit_publisher-linux-x86_64-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: sz_rabbit_publisher-linux-aarch64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_name: sz_rabbit_publisher-linux-aarch64-musl
          # macOS (aarch64) returns once Developer ID signing + notarization
          # secrets exist; unsigned macOS binaries are blocked by Gatekeeper.
          # Windows is not published.

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (pinned 2026-07-18)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release
        run: |
          # --version reports the release tag (v0.6.1 -> 0.6.1); see VERSION in src/main.rs.
          export RELEASE_VERSION="${TAG#v}"
          cargo build --release --locked --target ${{ matrix.target }} --verbose

      - name: Strip and smoke-test binary
        run: |
          BIN=target/${{ matrix.target }}/release/sz_rabbit_publisher
          strip "$BIN"
          file "$BIN"
          got=$("$BIN" --version)
          echo "$got"
          [ "$got" = "sz_rabbit_publisher ${TAG#v}" ] || { echo "version mismatch: want ${TAG#v}"; exit 1; }

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/${{ matrix.target }}/release/sz_rabbit_publisher "${{ matrix.asset_name }}"
          gh release upload "$TAG" "${{ matrix.asset_name }}" -R "$GITHUB_REPOSITORY" --clobber

  publish-crate:
    name: Publish to crates.io
    if: github.event_name == 'push'
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (pinned 2026-07-18)

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_TOKEN }}
